<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>QR Code print</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js" type="text/javascript"></script>
<style type="text/css">
* { box-sizing:border-box; }
body { margin: 0; padding: 4mm; font-family: Arial, sans-serif; }
.qbox {	width: 33.3%; padding: 0; float: left; text-align: center; height: 67.3mm; }
#tpl{ display: none; }
.barcode{ font-family: IDAutomationC39M; font-size: 18px; height: 12mm; overflow: hidden; }
.clear{	clear:both;	page-break-after: always; }
@media print {
	@page {
		size: 210mm 297mm;
		margin: 0;
		padding: 4mm;
	}
}
</style>
</head>
<body>
<div id="tpl" class="qbox">
<img src="qr.png" width="220" style="margin-top:6mm;" />
</div>
</body>
<script type="text/javascript">
$(function(){
	var tpl = $('#tpl');
	var pp = 12;
	var i = 0;
	for(var l = 1; l <= pp; l++){
		box = tpl.clone().attr('id','');
		$('body').append(box.show());
		if(i > 1 && i % 12 == 0) $('body').append('<div class="clear"></div>');
		i++;
	}
});
</script>
</html>
