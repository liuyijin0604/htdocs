<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Barcode Generator</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js" type="text/javascript"></script>
<style type="text/css">
* { box-sizing:border-box; }
body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
.qbox {	width: 33.3%; padding: 2mm; float: left; text-align: center; height: 24mm; }
#tpl{ display: none; }
.l1{ font-size: 18px; line-height: 6mm; height: 6mm; text-align:center; overflow: hidden; margin-top:1mm; }
.barcode{ font-family: IDAutomationC39M; font-size: 18px; height: 12mm; overflow: hidden; }
.clear{	clear:both;	page-break-after: always; }
@media print {
	@page {
		size: 210mm 297mm;
		margin: 0;
		padding: 0;
		margin-top: 10mm;
	}
}
</style>
</head>
<body>
<div id="tpl" class="qbox">
<div class="barcode"></div>
<div class="l1"></div>
</div>
</body>
<script type="text/javascript">

$(function(){
	var tpl = $('#tpl');
	var ppg = 33;

	for(var i = 0; i < ppg; i++){
		box = tpl.clone().attr('id','');
		$('.l1', box).html('PCA Express 奶粉特价');
		$('.barcode', box).html('*PSG/R0001*');
		$('body').append(box.show());
	}
});
</script>
</html>
